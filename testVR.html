<!doctype html>
<html>
<head> 
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
    <title>=WebVR • A-Frame Test 1</title>
    <meta name="description" content="Hello, WebVR! • A-Frame">
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.0/dist/aframe-extras.min.js"></script>
<script src="https://unpkg.com/aframe-event-set-component@^4.0.0/dist/aframe-event-set-component.min.js"></script>
<script src="https://unpkg.com/super-hands@3.0.0/dist/super-hands.min.js"></script>
<script>AFRAME.registerComponent('play-on-click', {
  init: function () {
    this.onClick = this.onClick.bind(this);
  },
  play: function () {
    window.addEventListener('click', this.onClick);
  },
  pause: function () {
    window.removeEventListener('click', this.onClick);
  },
  onClick: function (evt) {
    var videoEl = this.el.getAttribute('material').src;
    if (!videoEl) { return; }
    this.el.object3D.visible = true;
    videoEl.play();
  }
}); </script>
<script>
AFRAME.registerComponent('volume', {
 init: function () {
   var buttonVolume = document.querySelector('#control-volume');
   var buttonMute = document.querySelector('#control-mute');
   var vid = document.querySelector('#vid1');
   
   vid.muted = true;
   //vid.setAttribute('volume', this.value);
   this.el.addEventListener('click', function (evt) {
   //alert(this.vid.muted);
   if(vid.muted === true){
    vid.muted = false;
    buttonVolume.setAttribute('visible', 'true');
    buttonMute.setAttribute('visible', 'false');
  }
  else if (vid.muted === false) {
    vid.muted = true;
    buttonVolume.setAttribute('visible', 'false');
    buttonMute.setAttribute('visible', 'true');
  }
}, false);
 }
 }); </script>
</head>

<body>
 <a-scene cursor="rayOrigin: mouse">
            <a-assets>
                <img id="texture" src="https://housegolp.hotglue.me/?scaletest.head.159077029072">
	<img id="img1" src="/images/fmp.jpg">
	<img id="img2" src="/images/Inanition1.jpg">
	<img id="img3" src="https://housegolp.hotglue.me/?scaletest.head.159077384768">
	<img id="img4" src="https://housegolp.hotglue.me/?scaletest.head.159077388740">
              <img id="unmute" src="https://housegolp.hotglue.me/?scaletest.head.159113104673" crossorigin="anonymous">
              <img id="mute" src="https://housegolp.hotglue.me/?scaletest.head.159113105468" crossorigin="anonymous">
		<img id="mute" src="https://housegolp.hotglue.me/?scaletest.head.159113105468" crossorigin="anonymous">
	<video id="vid1" preload="auto" autoplay="true" loop="true" src="/animationf/stroking2.mp4" webkit-playsinline playsinline></video>
	<video id="vid2" preload="auto" autoplay="true" loop="true" src="/animationf/cross sectionshort.mp4"  webkit-playsinline playsinline></video>
	
            </a-assets> 

<a-entity id="camera" position="0 3 20" camera="userHeight: 1.6" wasd-controls look-controls>
</a-entity>
  

	<a-curvedimage src="#texture" width="4" height="6" theta-length="-120" position="-6 0 -3" rotation="0 -70 0"></a-curvedimage>
	<a-image src="#img1" width="2" height="3" position="3 0 7" rotation="0 -120 0"></a-image>

	<a-image src="#img3" width="2" height="3" position="9 8 -10" rotation="0 -45 0"></a-image>
	<a-image src="#img4" width="2" height="3" position="-9 9 -8" rotation="0 25 0"></a-image>
	
  <a-video src="#vid1" width="16" height="9" position="0 -6 -2" rotation="90 90 0" play-on-click>
   <a-image id="control-volume" class="clickable" src="#mute" rotation="180 0 180" position="7 -3.5 -.1" volume> </a-image>
      <a-image id="control-mute" class="clickable" src="#unmute" rotation="180 0 180" position="7 -3.5 -.1" visible="false" volume> </a-image>
         </a-video>


	<a-video src="#vid2" width="16" height="9" position="15 2 -10" rotation="0 -90 0" play-on-click>

</a-video>
	


<a-sky color="#111111"></a-sky>
        </a-scene>
</body>
</html>
